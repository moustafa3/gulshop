services:
  postgres:
    image: postgres:16-alpine
    container_name: gulshop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gulshop
      POSTGRES_USER: gulshop
      POSTGRES_PASSWORD: gulshop
    ports:
      - "5432:5432"
    volumes:
      - gulshop-postgres-data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: gulshop-backend
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/gulshop
      SPRING_DATASOURCE_USERNAME: gulshop
      SPRING_DATASOURCE_PASSWORD: gulshop
      JWT_SECRET: change-me-change-me-change-me-change-me-change-me-change-me
      JWT_EXPIRATION_MINUTES: 60
    ports:
      - "8080:8080"
  frontend:
    build:
      context: ./frontend
    container_name: gulshop-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  gulshop-postgres-data:
