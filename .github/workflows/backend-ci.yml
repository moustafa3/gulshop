name: Backend CI

on:
  pull_request:
    branches:
      - develop
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

  push:
    branches:
      - develop
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  backend-tests:
    name: Build and test backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gulshop
          POSTGRES_USER: gulshop
          POSTGRES_PASSWORD: gulshop
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U gulshop -d gulshop"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: backend

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/gulshop
      SPRING_DATASOURCE_USERNAME: gulshop
      SPRING_DATASOURCE_PASSWORD: gulshop
      JWT_SECRET: change-me-change-me-change-me-change-me-change-me-change-me
      JWT_EXPIRATION_MINUTES: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run backend tests
        run: ./mvnw clean test
