spring.application.name=gulshop-backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gulshop}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:gulshop}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:gulshop}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

server.port=8080

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

gulshop.jwt.secret=${JWT_SECRET:change-me-change-me-change-me-change-me-change-me-change-me}
gulshop.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
